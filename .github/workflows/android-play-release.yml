# LogKitty: built, signed and published by HereLiesAz/workflows (.github/workflows/android-play-release.yml):
# the R8-shrunk :app:bundleRelease (on-demand :feature:stats included) to Google Play on the shared tracks.
# This file is the trigger contract; the central sync replaces it with a tracker.
name: Android Play Release
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "core/**"
      - "feature/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
  workflow_dispatch:
permissions: {}
jobs:
  hand-off:
    runs-on: ubuntu-latest
    steps:
      - run: echo "LogKitty's Android Play Release runs centrally in HereLiesAz/workflows."
